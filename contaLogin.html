<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AKAI</title>
  <link rel="stylesheet" href="contaLogin.css">
  <script src="script.js"></script>
</head>
<body>

  <div class="bola1"></div>
  <div class="bola2"></div>

  <div class="topo">
    <div id="logo"><img src="img/akai.png" alt=""></div>
  </div>

  <div class="tudo">
    <div class="comida-fundo">
      <img class="yakisoba" src="img/yakisoba tela entrada.png" alt="">
    </div>

    <div class="caixa-login">
      <div class="topo-card">
        <p class="tit1">Acesse a sua conta</p> 
        <p class="subtitulo2Indrodução">Continue de onde sua última experiência terminou.</p>
      </div>

      <form class="login-form">
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Senha:</label>
            <a href="" class="forgot-link">Esqueceu sua senha?</a>
          </div>
          <input type="password" id="password" required>
        </div>

        <button type="submit" class="btn-primary">
          Entrar na minha conta &rarr;
        </button>
      </form>

      <div class="card-footer">
        <span>Ainda não tem conta?</span>
        <a href="cadastro.html" class="signup-link">Cadastre-se</a>
      </div>
    </div>
  </div>

</body>
</html>
