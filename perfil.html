    <section>

        <div class="forma-vermelha">
            <div id="bola-vermelho"></div>


        </div>



        <div id="Texto1">

            <p id="sss"><span>Minha conta</span></p>
            <h1 id="titulo">Meu <span>perfil</span></h1>
            <p>Gerencie suas informações pessoais e mantenha sua conta sempre atualizada.</p>
        </div>

     

        <div id="caixaDeDados">

            <!-- Alterar Foto -->

            <div class="profile-card">

                <div class="avatar-container" id="avatarContainer">

                    <svg class="avatar-default-icon" id="defaultIcon" viewBox="0 0 24 24">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>

                    <img class="avatar-preview" id="avatarPreview" src="" alt="Foto de perfil" style="display: none;">
                </div>


                <input type="file" id="fileInput" class="file-input" accept="image/*">
                <label for="fileInput" class="upload-button">
                    <span class="material-symbols-outlined" style="font-size: 18px;"></span>
                    Alterar foto
                </label>

            </div>

            <div id="Formulario">
                <h2>Dados pessoais</h2>
                
                <form id="meuFormulario" action="https://formsubmit.co" method="POST">

                    <DIV>
                    
                    <div class="campo-grupo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="name" maxlength="50" required>
                    </div>
        
                    <div class="campo-grupo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" title="O e-mail deve terminar obrigatoriamente com @gmail.com" maxlength="30">
                    </div>
        
                    <div class="campo-grupo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="password" required>
                    </div>

                </DIV>

                <DIV>
        
                    <div class="campo-grupo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telephone" placeholder="(31)99999-9999" oninput="mascara_telefone()" maxlength="14" required>
                    </div>
        
                    <div class="campo-grupo">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="text" id="nascimento" name="birthdate" placeholder="DD/MM/AAAA" oninput="mascara_data()" maxlength="10" required>
                    </div>
        
                    <button type="submit">Salvar alterações</button>

                </DIV>

                </form>
            </div>


            

            </div>

        </div>



        <div class="forma-laranja">
            <div id="bola-laranja"></div>


        </div>

    </section>
