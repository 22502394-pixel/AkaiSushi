<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - AKAI</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    
    <div class="bola1"></div>
  <div class="bola2"></div>

  <div class="topo">
    <div id="logo"><img src="img/akai.png" alt=""></div>
  </div>

  <div class="tudo">
    <div class="comida-fundo">
      <img class="yakisoba" src="img/sushi fundo cadastro.png" alt="">
    </div>

    <div class="caixa-login">
      <div class="topo-card">
        <p class="tit1">Cadastre-se</p> 
        <p class="subtitulo2Indrodução">Fiquei por dentro das nossa promoções!
        </p>
      </div>

      <form class="login-form">
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Senha:</label>
            <a href="" class="forgot-link">Esqueceu sua senha?</a>
          </div>
          <input type="password" id="password" required>
        </div>

        <button type="submit" class="btn-primary">
          Entrar na minha conta &rarr;
        </button>
      </form>

      <div class="card-footer">
        <span>Já tem cadastro?</span>
        <a href="contaLogin.html" class="signup-link">Entrar</a>
      </div>
    </div>
  </div>
    
</body>
</html>
